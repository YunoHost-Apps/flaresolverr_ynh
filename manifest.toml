#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "flaresolverr"
name = "FlareSolverr"
description.en = "Proxy server to bypass Cloudflare protection"
description.fr = "Serveur proxy pour contourner la protection Cloudflare"

version = "3.5.2~ynh1"

maintainers = []

[upstream]
license = "MIT"
admindoc = "https://github.com/FlareSolverr/FlareSolverr/blob/master/README.md"
code = "https://github.com/FlareSolverr/FlareSolverr"
cpe = "cpe:2.3:a:flaresolverr:flaresolverr"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "500M"
ram.build = "350M"
ram.runtime = "512M"

[install]
    # Headless proxy for the arr suite: no web interface, no install questions.
    # It listens on 127.0.0.1 only; see doc/ADMIN.md for the URL to use
    # in Lidarr/Prowlarr/Radarr/Sonarr indexer proxy settings.

[resources]
    # Native Python + system chromium, mirroring upstream's own Dockerfile
    # (pip install -r requirements.txt + chromium/chromium-driver/xvfb).
    # Deliberately NOT upstream's release .tar.gz: that is a pyinstaller
    # bundle with a bundled x86-64 Chrome, unusable on arm64.
    [resources.sources.main]
    url = "https://github.com/FlareSolverr/FlareSolverr/archive/refs/tags/v3.5.2.tar.gz"
    sha256 = "e83ffb2e7f8b95769d33fad7848ea31c3a84d2e0a7771f7536209457ea03661c"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "tarball"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    # Holds the patched chromedriver cache (undetected_chromedriver writes
    # under $HOME, which the unit points here) — survives upgrade's wipe.

    [resources.ports]
    main.default = 8191

    [resources.apt]
    packages = [
        "chromium",
        "chromium-driver",
        "xvfb",
        "python3-venv",
        "procps"
    ]
